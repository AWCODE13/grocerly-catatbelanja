[versions]
agp = "8.13.2"
kotlin = "2.0.21"

# ⬇⬇ TURUNKAN KE VERSI STABIL (API 34 / 35)
coreKtx = "1.12.0"
activity = "1.8.2"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
